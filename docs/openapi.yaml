openapi: 3.1.0
info:
  title: Orders API
  version: 0.1.0
  description: >-
    Single-domain orders API built for the Full Cycle final project (Project B).
    Money is always an integer number of cents.
  contact:
    name: João Pedro Lira and Leandro Frota
    url: https://github.com/lirajoaop/gt-fullcycle-final-project
servers:
  - url: http://localhost:3000
    description: Local (npm run dev or docker compose)
tags:
  - name: orders
    description: Create and retrieve orders
  - name: health
    description: Service health
paths:
  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create an order
      description: >-
        Validates the body and the business rules (RN01–RN07) and creates a new
        order with status `pending`. Every broken rule is reported at once (RN10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customerName: Ana Souza
              items:
                - sku: CAFE-500G
                  quantity: 2
                  unitPriceCents: 3490
                - sku: FILTRO-103
                  quantity: 1
                  unitPriceCents: 1250
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 3f6c2a8e-1b4d-4c1e-9f2a-7d5b8e9c0a11
                customerName: Ana Souza
                items:
                  - sku: CAFE-500G
                    quantity: 2
                    unitPriceCents: 3490
                  - sku: FILTRO-103
                    quantity: 1
                    unitPriceCents: 1250
                totalCents: 8230
                status: pending
                createdAt: '2026-11-16T12:00:00.000Z'
                updatedAt: '2026-11-16T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/InvalidOrder'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}:
    get:
      tags: [orders]
      operationId: getOrderById
      summary: Get an order by id
      description: Returns the order with the given id.
      parameters:
        - name: id
          in: path
          required: true
          description: Order id (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No order with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ORDER_NOT_FOUND
                  message: Order 00000000-0000-4000-8000-000000000000 not found
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: Answers 200 while the API is up.
      responses:
        '200':
          description: The API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
components:
  schemas:
    OrderItem:
      type: object
      required: [sku, quantity, unitPriceCents]
      properties:
        sku:
          type: string
          minLength: 1
          description: Required, surrounding spaces are removed (RN03)
        quantity:
          type: integer
          minimum: 1
          description: Integer greater than 0 (RN04)
        unitPriceCents:
          type: integer
          minimum: 0
          description: Unit price in cents, integer greater than or equal to 0 (RN05)
    CreateOrderRequest:
      type: object
      required: [customerName, items]
      properties:
        customerName:
          type: string
          minLength: 1
          maxLength: 100
          description: Required, at most 100 characters after trimming (RN01)
        items:
          type: array
          minItems: 1
          description: At least 1 item (RN02)
          items:
            $ref: '#/components/schemas/OrderItem'
    Order:
      type: object
      required: [id, customerName, items, totalCents, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        customerName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalCents:
          type: integer
          minimum: 0
          description: Sum of quantity × unitPriceCents (RN06)
        status:
          type: string
          enum: [pending, paid, shipped, cancelled]
          description: New orders start as pending (RN07)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_ORDER, ORDER_NOT_FOUND, INVALID_TRANSITION, INTERNAL_ERROR]
            message:
              type: string
            details:
              type: array
              items:
                type: string
  responses:
    InvalidOrder:
      description: The body has the wrong shape or breaks a business rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_ORDER
              message: 'Invalid order: customerName is required; order must have at least 1 item'
              details:
                - customerName is required
                - order must have at least 1 item
    InternalError:
      description: Unexpected error; details go to the logs, not to the response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Unexpected internal error
